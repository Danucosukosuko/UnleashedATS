<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="UnleashedATS, custom firmware for the ATS-Mini receiver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1710"/>
      <stop offset="1" stop-color="#0f0c08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf74"/>
      <stop offset="1" stop-color="#c98d2c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2a2216" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)" opacity=".6"/>
  <!-- Signal trace, like the FM-DX style remote -->
  <path d="M0 250 C90 244 150 256 240 248 S390 238 470 250 S620 262 700 246 S800 214 830 246 S980 256 1060 248 S1160 242 1200 246"
        fill="none" stroke="#d9a441" stroke-width="3" opacity=".55"/>
  <!-- Logo -->
  <g transform="translate(60 42) scale(0.84)">
    <rect width="256" height="256" rx="44" fill="#14100a" stroke="#3a3020" stroke-width="4"/>
    <g fill="none" stroke="url(#amber)" stroke-linecap="round">
      <path d="M86 70a60 60 0 0 0 0 76" stroke-width="10"/>
      <path d="M170 70a60 60 0 0 1 0 76" stroke-width="10"/>
      <path d="M62 50a92 92 0 0 0 0 116" stroke-width="8" opacity=".75"/>
      <path d="M194 50a92 92 0 0 1 0 116" stroke-width="8" opacity=".75"/>
    </g>
    <circle cx="128" cy="108" r="14" fill="url(#amber)"/>
    <path d="M128 122 L106 200 M128 122 L150 200 M114 172 H142" stroke="url(#amber)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#f2e6cf" stroke-width="8" stroke-linecap="round">
      <path d="M70 214 h-16 a14 14 0 0 1 0 -28 h16"/>
      <path d="M186 186 h16 a14 14 0 0 1 0 28 h-16"/>
    </g>
    <g stroke="#f2e6cf" stroke-width="5" stroke-linecap="round">
      <path d="M84 192 l10 -8"/><path d="M84 208 l10 8"/>
      <path d="M172 192 l-10 -8"/><path d="M172 208 l-10 8"/>
    </g>
  </g>
  <!-- Title -->
  <text x="330" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f2e6cf">Unleashed<tspan fill="url(#amber)">ATS</tspan></text>
  <text x="334" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#a8946f">Custom firmware (CFW) for the ATS-Mini SI4732 receiver</text>
  <!-- Feature chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700">
    <g transform="translate(334 202)"><rect width="104" height="30" rx="8" fill="#d9a441"/><text x="52" y="21" text-anchor="middle" fill="#1a1206">RDS AF</text></g>
    <g transform="translate(448 202)"><rect width="72" height="30" rx="8" fill="#d9a441"/><text x="36" y="21" text-anchor="middle" fill="#1a1206">EON</text></g>
    <g transform="translate(530 202)"><rect width="174" height="30" rx="8" fill="#d9a441"/><text x="87" y="21" text-anchor="middle" fill="#1a1206">STATION LISTS</text></g>
    <g transform="translate(714 202)"><rect width="104" height="30" rx="8" fill="#d9a441"/><text x="52" y="21" text-anchor="middle" fill="#1a1206">DX MODE</text></g>
    <g transform="translate(828 202)"><rect width="150" height="30" rx="8" fill="#d9a441"/><text x="75" y="21" text-anchor="middle" fill="#1a1206">FM-DX REMOTE</text></g>
    <g transform="translate(988 202)"><rect width="140" height="30" rx="8" fill="none" stroke="#d9a441" stroke-width="2"/><text x="70" y="21" text-anchor="middle" fill="#d9a441">AUTO STORE</text></g>
  </g>
</svg>
